  <body>
    <main id="demo">
      <noscript>
        <h1>Escapement</h1>
        <p>
          A model of an optical video feedback rig for Resolume: a camera
          looking at a screen through glass that splits the light. Nothing in it
          draws a fractal. Sierpinski, Koch, the Heighway dragon and Barnsley's
          fern are what the loop settles into for different tap configurations,
          and the zoom never runs out because it's a rate and no coordinate is
          ever stored.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/escapement/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/escapement/">Project page and downloads</a></li>
